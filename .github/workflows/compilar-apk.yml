name: Compilar APK Dinamica 106.7 FM

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontro el ZIP"
            exit 1
          fi

          unzip -q "$ZIP" -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4

      - name: Buscar proyecto Android
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontro gradlew"
            exit 1
          fi

          echo "Proyecto encontrado: $GRADLEW"

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew -print -quit)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Din
